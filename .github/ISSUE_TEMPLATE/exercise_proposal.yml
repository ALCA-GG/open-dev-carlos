name: Propuesta de ejercicio
description: Propón un ejercicio nuevo para la ruta de aprendizaje.
title: "[Ejercicio]: "
labels: ["exercise", "needs-review"]
body:
  - type: input
    id: title
    attributes:
      label: Título del ejercicio
      placeholder: Calculadora de propinas
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo de aprendizaje
      description: ¿Qué concepto debe practicar la persona que resuelva el ejercicio?
    validations:
      required: true

  - type: textarea
    id: knowledge
    attributes:
      label: Conocimientos previos necesarios
      placeholder: Variables, operadores aritméticos y salida por consola.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica el enunciado sin revelar la solución.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Entrada esperada
      description: Indica ejemplos de datos de entrada o escribe "No requiere entrada".
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Salida esperada
      description: Muestra ejemplos exactos de la salida.
    validations:
      required: true

  - type: textarea
    id: hints
    attributes:
      label: Pistas opcionales
      description: Ayudas graduales que no desvelen la solución completa.
    validations:
      required: false

  - type: dropdown
    id: difficulty
    attributes:
      label: Dificultad
      options:
        - Principiante
        - Intermedio
        - Avanzado
    validations:
      required: true
