name: Validación de Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Título convencional
    runs-on: ubuntu-latest
    steps:
      - name: Validar el título del Pull Request
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|style|chore|build|ci|perf|revert)(\([a-z0-9-]+\))?: [a-z0-9].*[^.]$'
          if [ "${#TITLE}" -gt 72 ]; then
            echo "El título supera los 72 caracteres." >&2
            exit 1
          fi
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "Título inválido: $TITLE" >&2
            echo "Formato esperado: <tipo>(<alcance>): <descripción>" >&2
            echo "Ejemplo: feat(docs): improve installation guide" >&2
            exit 1
          fi
