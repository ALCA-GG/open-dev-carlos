name: Validación de Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Título convencional
    runs-on: ubuntu-latest
    steps:
      - name: Validar el título del Pull Request
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            style
            chore
            build
            ci
            perf
            revert
          requireScope: false
          subjectPattern: ^[a-z0-9].*(?<!\.)$
          subjectPatternError: |
            La descripción debe empezar en minúscula y no terminar en punto.
            Ejemplo: feat(exercises): add calculator exercise

  repository:
    name: Estructura y formato
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar herramientas
        run: npm ci

      - name: Validar repositorio
        run: npm run validate
